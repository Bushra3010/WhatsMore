# Publishes the WHATSMORE app (web/, static build) to GitHub Pages at https://bushra3010.github.io/WhatsMore/
# The old Command Center page from legacy/ is served at /WhatsMore/admin.html.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build the app
        working-directory: web
        run: npm run build:pages
      - name: Add the Command Center page
        run: |
          mkdir -p site
          cp -R web/.apk-build/out/. site/
          cp legacy/admin.html site/admin.html
          mkdir -p site/css site/js
          cp legacy/css/admin.css site/css/admin.css
          cp legacy/js/admin.js site/js/admin.js
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
